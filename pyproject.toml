[project]
name = "brobot-infra"
version = "0.1.0"
description = "Reusable AWS CDK constructs"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.265.0",
    "constructs>=10.8.1",
]

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "brobot.infra"
namespace = true
