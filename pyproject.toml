[project]
name = "brobot-infra"
version = "0.1.0"
description = "Reusable AWS CDK constructs"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.252.0",
    "constructs>=10.6.0",
]

[dependency-groups]
dev = [
    "pyrefly>=0.63.1",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "brobot.infra"
namespace = true
